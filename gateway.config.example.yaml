default_model: glm-5.1

# Upstream request timeout in milliseconds (default: 30000).
request_timeout_ms: 30000

# Maximum retry attempts on transient failures (429, 502, 503). Default: 0 (no retry).
max_retries: 0

# Maximum request body size in kilobytes (default: 1024 = 1MB).
max_body_size_kb: 1024

# Gateway auth token env var reference. When set, incoming requests must include
# a matching x-api-key or Authorization: Bearer header. Disabled by default.
# gateway_auth_token_env: GATEWAY_AUTH_TOKEN

# Enable upstream connectivity probing in /healthz (default: false).
# health_probe_enabled: false

# CORS origin for browser-based clients. Accepts a single origin string,
# "*" for wildcard, or an array of origin strings. Disabled by default.
# cors_origin: http://localhost:5173
# cors_origin:
#   - http://localhost:5173
#   - https://admin.example.com

# Workspace / multi-tenant support. Disabled by default.
# When enabled, the gateway adds workspace context middleware, workspace-scoped
# API keys, RBAC, usage tracking, and an admin API for managing workspaces.
# workspace_enabled: false

# Copilot proxy settings for VS Code extension connections. Disabled by default.
# Requires gateway_auth_token_env to issue scoped extension proxy tokens.
# copilot_proxy_enabled: false
# Optional, defaults to true. When false, /ws/copilot-proxy accepts
# extension connections without a token query param.
# copilot_proxy_require_token_auth: true
# copilot_proxy_token_ttl_seconds: 86400
# copilot_proxy_heartbeat_interval_ms: 30000
# copilot_proxy_heartbeat_timeout_ms: 10000
# copilot_proxy_max_inflight_per_connection: 4
# Allowed model ID prefixes for extension registrations. Extensions must register
# models with IDs starting with one of these prefixes. Default: ["copilot-"]
# copilot_proxy_allowed_prefixes:
#   - copilot-
#   - alazyer-

models:
  - name: glm-5.1
    upstream_model: glm-5.1
    base_url: https://provider-a.example/v1
    api_key_env: ERNIE_ACCESSCODE
    owned_by: beacon
    supports_tools: true
    supports_streaming: true
    unknown_field_mode: warn
    # Number of requests before unknown-field counter resets (default: 100).
    unknown_field_window_requests: 100

  - name: coder-alias
    upstream_model: provider-internal-coder
    base_url: https://provider-b.example/v1
    api_key_env: CODER_API_KEY
    owned_by: custom-provider
    supports_tools: true
    supports_streaming: true
    unknown_field_mode: warn
    unknown_field_window_requests: 100

  - name: claude-sonnet-4-5
    upstream_model: provider-compatible-sonnet
    base_url: https://provider-b.example/v1
    api_key_env: CODER_API_KEY
    owned_by: anthropic-compatible
    supports_tools: true
    supports_streaming: true
    # Whether the upstream model accepts image input. When true, the web chat
    # composer enables image attachments and `GET /v1/models` advertises
    # `input_modalities: ["text", "image"]`. Defaults to false (text-only).
    supports_image_input: true
    unknown_field_mode: enforce
    unknown_field_window_requests: 100
