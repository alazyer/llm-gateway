# ── Seed-Only Configuration ─────────────────────────────────────────────────────
# This file is read ONLY on first startup when the database is empty.
# After seeding, the database (GATEWAY_DB_PATH) is the source of truth.
# Changes to this file after first startup have NO effect.
#
# To modify configuration after first startup, use the Admin API:
#   GET    /admin/models              — List models with status
#   GET    /admin/models/:name        — Single model detail
#   POST   /admin/models/:name/activate   — Activate a model
#   POST   /admin/models/:name/deactivate — Deactivate a model (with optional reason)
#   GET    /admin/chains              — List chains with status
#   GET    /admin/chains/:name        — Single chain detail
#   GET    /admin/status              — Gateway status summary
#   GET    /admin/database            — Database info
#
# All admin endpoints require gateway auth (Authorization: Bearer $GATEWAY_AUTH_TOKEN).
# ────────────────────────────────────────────────────────────────────────────────

default_model: glm-5.1

# Upstream request timeout in milliseconds (default: 30000).
request_timeout_ms: 30000

# Maximum retry attempts on transient failures (429, 502, 503). Default: 0 (no retry).
max_retries: 0

# Maximum request body size in kilobytes (default: 1024 = 1MB).
max_body_size_kb: 1024

# Gateway auth token env var reference. When set, incoming requests must include
# a matching x-api-key or Authorization: Bearer header. Disabled by default.
# gateway_auth_token_env: GATEWAY_AUTH_TOKEN

# Enable upstream connectivity probing in /healthz (default: false).
# health_probe_enabled: false

# CORS origin for browser-based clients. Accepts a single origin string,
# "*" for wildcard, or an array of origin strings. Disabled by default.
# cors_origin: http://localhost:5173
# cors_origin:
#   - http://localhost:5173
#   - https://admin.example.com

# Copilot proxy settings for VS Code extension connections. Disabled by default.
# Requires gateway_auth_token_env to issue scoped extension proxy tokens.
# copilot_proxy_enabled: false
# Optional, defaults to true. When false, /ws/copilot-proxy accepts
# extension connections without a token query param.
# copilot_proxy_require_token_auth: true
# copilot_proxy_token_ttl_seconds: 86400
# copilot_proxy_heartbeat_interval_ms: 30000
# copilot_proxy_heartbeat_timeout_ms: 10000
# copilot_proxy_max_inflight_per_connection: 4
# Allowed model ID prefixes for extension registrations. Extensions must register
# models with IDs starting with one of these prefixes. Default: ["copilot-"]
# copilot_proxy_allowed_prefixes:
#   - copilot-
#   - alazyer-

models:
  - name: glm-5.1
    upstream_model: glm-5.1
    base_url: https://provider-a.example/v1
    api_key_env: ERNIE_ACCESSCODE
    owned_by: beacon
    supports_tools: true
    supports_streaming: true
    unknown_field_mode: warn
    # Number of requests before unknown-field counter resets (default: 100).
    unknown_field_window_requests: 100

  - name: coder-alias
    upstream_model: provider-internal-coder
    base_url: https://provider-b.example/v1
    api_key_env: CODER_API_KEY
    owned_by: custom-provider
    supports_tools: true
    supports_streaming: true
    unknown_field_mode: warn
    unknown_field_window_requests: 100

  - name: claude-sonnet-4-5
    upstream_model: provider-compatible-sonnet
    base_url: https://provider-b.example/v1
    api_key_env: CODER_API_KEY
    owned_by: anthropic-compatible
    supports_tools: true
    supports_streaming: true
    unknown_field_mode: enforce
    unknown_field_window_requests: 100

# ── Model Chains ──────────────────────────────────────────────────────────────
# Model chains define ordered fallback groups. When a request targets a chain
# (by setting the model field to chain-<name>), the gateway tries each model
# in order until one succeeds. If every model fails, the last error is returned.
#
# name              — Chain identifier. Used as chain-<name> in the request model
#                     field (e.g. "chain-production"). Must not match any model
#                     name in the catalog, and chain-<name> must not collide with
#                     a model name either. Duplicate chain names are rejected.
#
# models            — Ordered fallback priority list (first = highest priority).
#                     Each entry can be a simple string matching a model name from
#                     the models catalog, or an object with per-model overrides:
#                       {name: <model-name>, timeout_ms: <ms>, max_retries: <n>}
#                     String form inherits timeout/retry from the chain or gateway.
#                     Models starting with "chain-" or any copilot-proxy prefix
#                     are not allowed in chains (no nesting, no proxied models).
#
# timeout_ms        — Default per-model timeout for this chain (milliseconds).
#                     Overrides the gateway-level request_timeout_ms. Each model
#                     in the chain uses this value unless a per-model override
#                     specifies otherwise.
#                     Resolution order: model-in-chain → chain → gateway
#
# max_retries       — Default per-model retry count for this chain. Overrides
#                     the gateway-level max_retries. Same 3-level resolution:
#                     model-in-chain → chain → gateway
#
# chain_timeout_ms  — Total wall-clock budget for the entire chain execution
#                     (all attempts, retries, and backoff delays). If exceeded,
#                     the chain stops and returns HTTP 504. When absent, no
#                     overall budget is enforced; each model is bounded only by
#                     its individual timeout.
#
# To route requests to a chain, set default_model or the per-request model
# field to chain-<name> (e.g. default_model: chain-production).

# model_chains:
#   # Simple chain: string-shorthand model entries
#   - name: production
#     models:
#       - glm-5.1
#       - coder-alias
#
#   # Chain with per-model overrides (object form)
#   - name: resilient
#     models:
#       - name: glm-5.1
#         timeout_ms: 60000
#         max_retries: 2
#       - name: coder-alias
#         timeout_ms: 45000
#
#   # Chain-level timeout/retry defaults + total budget
#   - name: slow-chain
#     timeout_ms: 60000
#     max_retries: 1
#     chain_timeout_ms: 90000
#     models:
#       - glm-5.1
#       - claude-sonnet-4-5
